name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # - run: cd apps/web && bun run typecheck
      # - run: bunx biome ci apps/web/src
      # - run: cd apps/web && bun test src
  # Posts in apps/web/content/blog publish on merge, so their checks gate the
  # PR. A job-level filter rather than `on.pull_request.paths`, which would
  # also skip `verify`; a PR that touches no post finishes green in seconds.
  blog-content:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^apps/web/(content/blog/|public/blog/|scripts/check-blog-content\.ts$|src/server/utils/blog-content\.ts$)'; then
            echo "blog=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.blog == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - if: steps.changes.outputs.blog == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.blog == 'true'
        working-directory: apps/web
        run: bun run blog:check
