name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build shared packages
        run: bun run build:packages
      - name: Generate Next route and message types
        run: |
          (cd apps/web && bunx next typegen)
          (cd apps/outbound && bunx next typegen)
      - name: Check workspace types
        run: bun run typecheck
      - name: Check source lint, formatting and imports
        run: bun run lint:check
      - name: Add disposable PostgreSQL test binaries
        run: |
          postgres_bins="$(pg_config --bindir)"
          test -x "$postgres_bins/initdb"
          test -x "$postgres_bins/pg_ctl"
          test -x "$postgres_bins/postgres"
          echo "$postgres_bins" >> "$GITHUB_PATH"
      - name: Test applications and shared packages
        run: bun run test
        env:
          NODE_ENV: test
          BUN_OPTIONS: --no-env-file
          DATABASE_URL: postgres://ci:unused@127.0.0.1:1/never_connect
          OUTBOUND_TEST_DATABASE_URL: ""
      - name: Check translations and theme tokens
        working-directory: apps/web
        run: |
          bun run i18n:check
          bun run design:theme
  # Posts in apps/web/content/blog publish on merge, so their checks gate the
  # PR, and run again on main for work pushed there directly. A job-level
  # filter rather than `paths:`, which would also skip `verify`; a change that
  # touches nothing the check reads finishes green in seconds.
  blog-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A new branch or a force push leaves no usable base: check anyway.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null ||
            git diff --name-only "$BASE...HEAD" | grep -qE '^(apps/web/(content/blog/|public/blog/|scripts/check-blog-content\.ts$|src/server/utils/blog-content\.ts$|src/lib/blog-(html|redirects)\.ts$|package\.json$)|bun\.lock$)'; then
            echo "blog=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.blog == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: steps.changes.outputs.blog == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - if: steps.changes.outputs.blog == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.blog == 'true'
        working-directory: apps/web
        run: bun run blog:check
