# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5ea19ab2a8ae98ba71f6f83b24be90cd"
application_url = "https://ecentic.ai"
embedded = false
name = "écentic"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_product_feeds,write_product_feeds,read_product_listings,write_product_listings,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://ecentic.ai/api/integrations/shopify/callback",
  "https://ecentic.ai/api/auth/oauth2/callback/shopify",
  "http://localhost:3000/api/integrations/shopify/callback",
  "http://localhost:3000/api/auth/oauth2/callback/shopify"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://ecentic.ai/api/integrations/shopify/webhooks"

[build]
automatically_update_urls_on_dev = true
